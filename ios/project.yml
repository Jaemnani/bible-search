name: BibleReader
options:
  bundleIdPrefix: com.biblereader
  deploymentTarget:
    iOS: "16.0"
packages:
  BibleReaderCore:
    path: BibleReaderCore
targets:
  BibleReader:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BibleReaderCore
        product: BibleReaderCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.biblereader.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
