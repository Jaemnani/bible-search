# bible-reader self-hosted backend — NAS(Synology 등) Docker
#
# 구성: Postgres / PostgREST(supabase-js 호환 REST) / MinIO(낙서·오디오·썸네일) / Caddy(라우팅)
# auction/deploy/synology 스택 재사용. 포트는 auction(8080/9000/9001/5050)과 겹치지 않게 +오프셋.
#
# 실행:
#   cp .env.example .env   # 비밀번호 채우기 (README 참고)
#   docker compose up -d
#   bash apply-migrations.sh
#   docker compose --profile admin up -d pgadmin   # 필요할 때만

services:
  db:
    image: postgres:16-alpine
    container_name: bible-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      # DB 최초 1회 자동 실행(데이터 비었을 때만) — 역할 생성(마이그레이션 선행).
      - ./bootstrap:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    mem_limit: 1g
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: bible-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "10"
    mem_limit: 256m
    networks: [internal]

  # 사용자 인증 (Supabase GoTrue) — 동일 JWT_SECRET 으로 토큰 발급 → PostgREST 검증 + RLS auth.uid().
  # supabase-js 가 ${SUPABASE_URL}/auth/v1/* 로 호출(Caddy 라우팅).
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: bible-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      # GoTrue 가 auth 스키마에 자체 테이블(users 등) 마이그레이션. postgres 로 접속(자가호스트).
      # ⚠️ 비밀번호는 URL 에 들어가므로 특수문자 없는 hex 여야 함(base64 의 / + = 는 URL 깨짐 → migrate panic).
      # search_path=auth 필수: 일부 GoTrue 마이그레이션이 비정규화 이름으로 타입/객체 생성(없으면 factor_type 누락).
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      # 외부에서 접근할 인증 API 공개 URL(필수). 노출 전엔 LAN 기본값으로 기동만.
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8081}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8081}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "false"
      # SMTP 미설정 시 이메일 자동확인(개발용). 운영은 SMTP 설정 권장.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # 외부 OAuth — .env 에서 활성화(iOS 공개앱은 Apple 필수). redirect 는 클라 콜백.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
    mem_limit: 256m
    networks: [internal]

  storage:
    image: minio/minio:latest
    container_name: bible-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./volumes/storage:/data
    mem_limit: 512m
    ports:
      - "9100:9000"   # S3 API (LAN) — 클라/서버 업로드 + Tunnel
      - "9101:9001"   # MinIO 콘솔 (LAN 관리용)
    networks: [internal]

  proxy:
    image: caddy:2
    container_name: bible-proxy
    restart: unless-stopped
    depends_on: [rest]
    ports:
      - "8081:80"     # /rest/v1/* , /storage/* , /health
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
    mem_limit: 128m
    networks: [internal]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bible-pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"     # LAN 내부만
    mem_limit: 300m
    networks: [internal]

networks:
  internal:
    driver: bridge
